[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 44444444
via_ir = true
# A launch compares deployed bytes against a local build, so the metadata hash must not be in them.
bytecode_hash = "none"
# No fs_permissions and no ffi: the launch sandbox refuses to run a build whose config reaches outside
# the build output, and nothing here needs either.

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "v4-periphery/=lib/v4-periphery/",
  "v4-core/=lib/v4-periphery/lib/v4-core/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "permit2/=lib/v4-periphery/lib/permit2/",
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
# Robinhood Chain (4663). Public endpoints rate-limit under fork load; if one starts refusing, swap it for
# another: rpc.ordofi.network, rpc-robinhood.blockmachine.io, robinhood.rpc.blxrbdn.com, rpc.mainnet.chain.robinhood.com
robinhood = "https://robinhood-rpc.publicnode.com"
